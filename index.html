<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#184e40">
<title>Meu Diário de Glicemia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#184e40;
  --g2:#256f5b;
  --g-soft:#e6f1ed;
  --bg:#f3f6f4;
  --surface:#ffffff;
  --surface-2:#f7faf8;
  --ink:#172621;
  --muted:#5c6e67;
  --line:#dfe8e3;
  --line-strong:#c7d6ce;
  --red:#b42318;
  --redbg:#fef0ef;
  --redline:#f8c8c4;
  --good:#196b45;
  --goodbg:#e7f5ee;
  --goodline:#bfe5d2;
  --amber:#875b0b;
  --amberbg:#fff6df;
  --blue:#2563eb;
  --shadow-sm:0 1px 2px rgba(16, 42, 31, .04), 0 4px 14px rgba(16, 42, 31, .04);
  --shadow-md:0 10px 28px rgba(16, 42, 31, .08);
  --radius-lg:18px;
  --radius-md:13px;
  --radius-sm:9px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:radial-gradient(circle at top right, #e4efe9 0%, var(--bg) 42%, var(--bg) 100%);
  color:var(--ink);
  font:15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height:100dvh;
}
button,input,textarea,select{
  font-family:inherit;
  touch-action:manipulation;
}
.mono{
  font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric:tabular-nums;
}

/* Header */
header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg, #133f34 0%, var(--g) 52%, var(--g2) 100%);
  color:#fff;
  padding:24px 18px 22px;
  box-shadow:0 6px 24px rgba(20, 63, 52, .16);
}
header::after{
  content:"";
  position:absolute;
  inset:auto -40px -65px auto;
  width:190px;
  height:190px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 70%);
  pointer-events:none;
}
.header-inner{max-width:780px;margin:auto;position:relative;z-index:1}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#d9eee6;background:rgba(255,255,255,.12);
  padding:4px 10px;border-radius:999px;margin-bottom:8px;
}
header h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
header p{margin:0;color:#e1f0ea;font-size:13.5px;max-width:52ch}

/* Layout */
main{max-width:780px;margin:auto;padding:14px 12px 48px}

/* Month Tabs */
.tabs-wrap{position:relative;margin-bottom:4px}
.tabs{
  display:flex;gap:7px;overflow-x:auto;padding:4px 2px 12px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  border:1px solid var(--line);
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(8px);
  color:var(--g);
  border-radius:999px;
  padding:8.5px 14px;
  white-space:nowrap;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  transition:transform .16s ease, background-color .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.tabs button:hover{border-color:var(--line-strong);background:#fff;transform:translateY(-1px)}
.tabs button:active{transform:scale(.97)}
.tabs button.active{
  background:var(--g);
  color:#fff;
  border-color:var(--g);
  box-shadow:0 4px 12px rgba(24, 78, 64, .24);
}

/* Cards */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:16px;
  margin-bottom:13px;
  box-shadow:var(--shadow-sm);
  animation:cardIn .26s ease both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
.card-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-bottom:12px;
}
.card h2{font-size:16px;font-weight:750;letter-spacing:-.01em;margin:0}
.card-sub{font-size:12px;color:var(--muted)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:12px 8px;
  text-align:center;
  transition:transform .18s ease, border-color .18s ease;
}
.stat:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.stat b{
  display:block;
  font-size:21px;
  font-weight:700;
  color:var(--g);
  line-height:1.2;
  margin-bottom:3px;
}
.stat span{font-size:11.5px;font-weight:600;color:var(--muted)}

/* View Switcher */
.viewtabs{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  background:#e6efea;padding:4px;border-radius:14px;
  border:1px solid var(--line);margin-bottom:13px;
}
.viewtabs button{
  border:0;background:transparent;color:var(--muted);
  border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;
  cursor:pointer;transition:background-color .18s ease, color .18s ease, box-shadow .18s ease;
}
.viewtabs button.active{
  background:#fff;color:var(--g);
  box-shadow:0 2px 8px rgba(16, 42, 31, .08);
}

/* Forms & Inputs */
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{
  font-size:12px;font-weight:700;color:#3d5049;
  display:block;margin-bottom:5px;
}
input,textarea,select{
  width:100%;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  padding:11px 12px;
  font-size:14.5px;
  background:#fff;
  color:var(--ink);
  min-width:0;
  transition:border-color .16s ease, box-shadow .16s ease, background-color .16s ease;
}
input:hover,textarea:hover,select:hover{border-color:#a8beb3}
input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:var(--g2);
  box-shadow:0 0 0 3px rgba(37, 111, 91, .15);
}
textarea{grid-column:1/-1;min-height:68px;resize:vertical}
.full{grid-column:1/-1}

button.primary,.action{
  border:0;border-radius:11px;
  background:linear-gradient(180deg, var(--g2) 0%, var(--g) 100%);
  color:#fff;padding:11.5px 14px;font-weight:700;font-size:13.5px;
  cursor:pointer;box-shadow:0 3px 10px rgba(24, 78, 64, .2);
  transition:transform .15s ease, filter .16s ease, box-shadow .16s ease;
}
button.primary:hover,.action:hover{filter:brightness(1.04);transform:translateY(-1px)}
button.primary:active,.action:active{transform:scale(.98)}

button.secondary,.action.secondary{
  background:var(--g-soft);color:var(--g);
  border:1px solid #cce0d7;box-shadow:none;
}
button.secondary:hover,.action.secondary:hover{background:#dcece5}

.range-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.range-meta{
  font-size:12.5px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);
  border-left:3.5px solid var(--g2);
  border-radius:10px;padding:10px 12px;margin-bottom:12px;
}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button,.actions label{flex:1;min-width:142px;text-align:center}

/* Entries */
.entry{
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  margin-top:10px;
  background:#fff;
  transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.entry:hover{border-color:var(--line-strong);box-shadow:0 4px 12px rgba(16, 42, 31, .05)}
.entrytop{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-bottom:10px;
}
.entrytop strong{font-size:14px;font-weight:750}
.entrytop .tools{white-space:nowrap;display:flex;gap:4px}
.delete{
  border:0;background:transparent;color:var(--red);
  font-size:12px;font-weight:700;padding:5px 8px;
  border-radius:7px;cursor:pointer;
  transition:background-color .15s ease, color .15s ease;
}
.delete.edit-btn{color:var(--g)}
.delete.edit-btn:hover{background:var(--g-soft)}
.delete:hover{background:var(--redbg)}

  border-
